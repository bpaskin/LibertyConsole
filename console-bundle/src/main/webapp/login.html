<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Liberty Admin Console</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Liberty Admin Console</h1>
                <p>Sign in to manage your server</p>
            </div>
            <form method="POST" action="j_security_check" class="login-form">
                <div class="form-group">
                    <label for="j_username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <input
                        type="text"
                        id="j_username"
                        name="j_username"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                        autofocus>
                </div>
                <div class="form-group">
                    <label for="j_password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <input
                        type="password"
                        id="j_password"
                        name="j_password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>
            <div class="login-footer">
                <p class="text-muted">
                    <i class="fas fa-info-circle"></i>
                    Sign in with an account in the server&#39;s administrator-role or reader-role
                </p>
            </div>
        </div>
    </div>
</body>
</html>
